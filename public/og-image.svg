<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="35%" cy="44%" r="65%">
      <stop offset="0%" stop-color="#080f1c"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#44aaff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <!-- Logo gradient: absolute coords after scale 2.5 + translate(80,100) -->
    <!-- original M11 46 → (107.5,215); M52 14 → (210,135) -->
    <linearGradient id="logoGrad" x1="108" y1="215" x2="210" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#44aaff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#44aaff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7c6fff" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="divFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#44aaff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#44aaff" stop-opacity="0"/>
    </linearGradient>
    <filter id="lGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glows -->
  <ellipse cx="155" cy="178" rx="130" ry="100" fill="#2060cc" opacity="0.07"/>
  <ellipse cx="340" cy="400" rx="300" ry="210" fill="#1840a0" opacity="0.04"/>
  <ellipse cx="920" cy="320" rx="310" ry="250" fill="#6820cc" opacity="0.04"/>

  <!-- ══ LOGO — chart path scale×2.5 translate(80,100) ══ -->
  <!-- M11 46 → (107.5, 215) · L23 36 → (137.5, 190) · L31 42 → (157.5, 205) · L52 14 → (210, 135) -->

  <!-- outer halo -->
  <path d="M107.5 215 L137.5 190 L157.5 205 L210 135"
        fill="none" stroke="#3388ff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.06"/>
  <!-- mid glow -->
  <path d="M107.5 215 L137.5 190 L157.5 205 L210 135"
        fill="none" stroke="#7755ee" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.09"/>
  <!-- crisp line -->
  <path d="M107.5 215 L137.5 190 L157.5 205 L210 135"
        fill="none" stroke="url(#logoGrad)" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#lGlow)"/>

  <!-- peak dot -->
  <circle cx="210" cy="135" r="18" fill="#a855f7" opacity="0.12"/>
  <circle cx="210" cy="135" r="10" fill="#a855f7" opacity="0.18"/>
  <circle cx="210" cy="135" r="5.5" fill="#c888ff"/>
  <circle cx="210" cy="135" r="2.5" fill="#eedfff"/>

