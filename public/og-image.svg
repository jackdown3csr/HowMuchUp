<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0e0e0e"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1e1e1e" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#1e1e1e" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#1e1e1e" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#1e1e1e" stroke-width="1"/>

  <!-- Accent bar top -->
  <rect x="0" y="0" width="1200" height="5" fill="#44aaff"/>

  <!-- Card surface -->
  <rect x="80" y="100" width="1040" height="430" rx="16" fill="#181818" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Left accent strip -->
  <rect x="80" y="100" width="6" height="430" rx="3" fill="#44aaff"/>

  <!-- Title -->
  <text x="160" y="235" font-family="'Segoe UI', system-ui, sans-serif" font-size="88" font-weight="700" fill="#f0f0f0" letter-spacing="-2">HowMuchUp</text>

  <!-- Subtitle -->
  <text x="163" y="300" font-family="'Segoe UI', system-ui, sans-serif" font-size="30" fill="#777" letter-spacing="0.5">Galactica gUBI rank &amp; reward simulator</text>

  <!-- Divider -->
  <line x1="160" y1="335" x2="600" y2="335" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Tags -->
  <rect x="160" y="358" width="130" height="38" rx="6" fill="#0e2030"/>
  <text x="225" y="383" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" fill="#44aaff" text-anchor="middle">veGNET</text>

  <rect x="306" y="358" width="150" height="38" rx="6" fill="#0e2030"/>
  <text x="381" y="383" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" fill="#44aaff" text-anchor="middle">SoulScore</text>

  <rect x="472" y="358" width="120" height="38" rx="6" fill="#0e2030"/>
  <text x="532" y="383" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" fill="#44aaff" text-anchor="middle">gUBI</text>

  <!-- Right decoration: mock rank rows -->
  <rect x="750" y="145" width="330" height="44" rx="6" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1"/>
  <text x="770" y="173" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" fill="#44aaff">#1</text>
  <rect x="800" y="163" width="120" height="8" rx="4" fill="#2a2a2a"/>
  <rect x="800" y="163" width="100" height="8" rx="4" fill="#44aaff" opacity="0.6"/>
  <text x="1060" y="173" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#4cc44c" text-anchor="end">+12%</text>

  <rect x="750" y="200" width="330" height="44" rx="6" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1"/>
  <text x="770" y="228" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" fill="#777">#2</text>
  <rect x="800" y="218" width="120" height="8" rx="4" fill="#2a2a2a"/>
  <rect x="800" y="218" width="80" height="8" rx="4" fill="#44aaff" opacity="0.4"/>
  <text x="1060" y="228" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#ff5555" text-anchor="end">-3%</text>

  <rect x="750" y="255" width="330" height="44" rx="6" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1"/>
  <text x="770" y="283" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" fill="#777">#3</text>
  <rect x="800" y="273" width="120" height="8" rx="4" fill="#2a2a2a"/>
  <rect x="800" y="273" width="55" height="8" rx="4" fill="#44aaff" opacity="0.3"/>
  <text x="1060" y="283" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#fa0" text-anchor="end">0%</text>

  <rect x="750" y="310" width="330" height="44" rx="6" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1"/>
  <text x="770" y="338" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" fill="#777">#4</text>
  <rect x="800" y="328" width="120" height="8" rx="4" fill="#2a2a2a"/>
  <rect x="800" y="328" width="35" height="8" rx="4" fill="#44aaff" opacity="0.2"/>
  <text x="1060" y="338" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#4cc44c" text-anchor="end">+2%</text>

  <rect x="750" y="365" width="330" height="44" rx="6" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1"/>
  <text x="770" y="393" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" fill="#777">#5</text>
  <rect x="800" y="383" width="120" height="8" rx="4" fill="#2a2a2a"/>
  <rect x="800" y="383" width="20" height="8" rx="4" fill="#44aaff" opacity="0.15"/>
  <text x="1060" y="393" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#ff5555" text-anchor="end">-8%</text>

  <!-- Bottom footer area -->
  <text x="163" y="490" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" fill="#444">galactica.network</text>

  <!-- Accent dot -->
  <circle cx="160" cy="490" r="5" fill="#44aaff"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="625" width="1200" height="5" fill="#44aaff" opacity="0.3"/>
</svg>
